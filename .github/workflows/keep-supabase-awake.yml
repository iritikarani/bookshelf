# Supabase pauses free projects after about a week without activity, which stops sign-in,
# shelves and sign-up emails. This makes one tiny read-only database call twice a week so
# the project always counts as active. It uses the same two repository secrets as deploy.yml
# (the public project URL and anon key the website already ships to every visitor).
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 * * 1,4" # Mondays and Thursdays, 03:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the database whether a username is free
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
          status=$(curl -sS -o response.txt -w "%{http_code}" -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/username_available" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"name":"keepalive"}')
          echo "Supabase answered $status: $(cat response.txt)"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer normally. If the project is paused, restore it in the Supabase dashboard."
            exit 1
          fi
