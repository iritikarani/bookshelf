# A weekly, encrypted copy of SelfShelf's database (every account's shelves, books, journals,
# rooms and guest book), kept for 30 days as a downloadable file on the Actions tab.
#
# The repository is public, so the copy is locked with a passphrase before it's stored: without
# BACKUP_PASSPHRASE nobody can read it. Uploaded cover photos live in Supabase Storage as files
# and aren't part of this copy. How to restore: docs/BACKUPS.md.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     the "Session pooler" connection string from Supabase → Connect,
#                       with your database password filled in
#   BACKUP_PASSPHRASE   a long passphrase you keep somewhere safe (a password manager)
name: Weekly backup

on:
  schedule:
    - cron: "41 2 * * 0" # Sundays, 02:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check the secrets are set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add SUPABASE_DB_URL and BACKUP_PASSPHRASE under Settings → Secrets and variables → Actions (see docs/BACKUPS.md)."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 12 ]; then
            echo "::error::BACKUP_PASSPHRASE is too short. Use at least 12 characters."
            exit 1
          fi
          # The password sits between "postgres.<project>:" and the last "@". Symbols such as # / ? @
          # in it break the address, so catch that here, without ever printing the password.
          case "$SUPABASE_DB_URL" in postgresql://*|postgres://*) ;; *) echo "::error::SUPABASE_DB_URL should start with postgresql:// (copy the Session pooler string from Supabase → Connect)."; exit 1;; esac
          rest="${SUPABASE_DB_URL#*://}"
          userpass="${rest%@*}"
          pass="${userpass#*:}"
          if [ "$pass" = "$userpass" ] || [ -z "$pass" ]; then
            echo "::error::SUPABASE_DB_URL has no password in it. Put your database password in place of [YOUR-PASSWORD]."
            exit 1
          fi
          echo "::add-mask::$pass"
          case "$pass" in *"["*|*"]"*) echo "::error::SUPABASE_DB_URL still has [ ] brackets in it. Replace [YOUR-PASSWORD], brackets and all, with your password."; exit 1;; esac
          case "$pass" in *"#"*|*"/"*|*"?"*|*"@"*|*" "*) echo "::error::Your database password has a symbol (# / ? @ or a space) that breaks the address. Reset it in Supabase to one with only letters and numbers, then update SUPABASE_DB_URL."; exit 1;; esac

      - name: Copy the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # pg_dump 17 reads Supabase's Postgres 15 and 17 alike.
          # pg_dump's own messages can contain parts of the address, so they're never printed (this
          # repository's logs are public); only a plain explanation is.
          if ! docker run --rm --network host -e DB_URL="$SUPABASE_DB_URL" postgres:17-alpine \
            sh -c 'pg_dump "$DB_URL" --schema=public --schema=auth --no-owner --no-privileges --quote-all-identifiers' > selfshelf.sql 2> pg_dump.err; then
            if grep -qi "password authentication failed" pg_dump.err; then why="The database password in SUPABASE_DB_URL is wrong. Check it, or reset it in Supabase and update the secret."
            elif grep -qi "translate host name\|could not resolve\|Name does not resolve" pg_dump.err; then why="The address in SUPABASE_DB_URL couldn't be read. Copy the Session pooler string again from Supabase → Connect."
            elif grep -qi "timeout\|timed out\|Connection refused\|Network is unreachable" pg_dump.err; then why="Supabase didn't answer. Check the project isn't paused, and that you used the Session pooler string (not Direct connection)."
            elif grep -qi "server version" pg_dump.err; then why="The database is a newer version than this backup tool. The workflow needs updating."
            else why="The database copy failed (details hidden to keep your password out of the public log)."
            fi
            shred -u pg_dump.err selfshelf.sql 2>/dev/null || true
            echo "::error::$why"
            exit 1
          fi
          shred -u pg_dump.err 2>/dev/null || true
          size=$(wc -c < selfshelf.sql)
          echo "Database copy: $size bytes"
          if [ "$size" -lt 1000 ] || ! grep -q 'CREATE TABLE "public"."books"' selfshelf.sql; then
            echo "::error::The copy looks incomplete, so it wasn't kept. Check SUPABASE_DB_URL, and that the Supabase project isn't paused."
            exit 1
          fi

      - name: Lock it with the passphrase
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          gzip -9 selfshelf.sql
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "selfshelf-$stamp.sql.gz.gpg" selfshelf.sql.gz
          shred -u selfshelf.sql.gz
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          ls -l selfshelf-*.gpg

      - name: Keep it for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: selfshelf-backup-${{ env.STAMP }}
          path: selfshelf-*.sql.gz.gpg
          retention-days: 30
          if-no-files-found: error
